<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Webpage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }
    header, footer {
      background: #333;
      color: white;
      padding: 10px 20px;
      text-align: center;
    }
    nav {
      background: #444;
      display: flex;
      justify-content: center;
    }
    nav a {
      color: white;
      padding: 10px 15px;
      text-decoration: none;
    }
    nav a:hover {
      background: #666;
    }
    .container {
      padding: 20px;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    form {
      margin-top: 20px;
      max-width: 400px;
    }
    input[type="text"], input[type="email"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      background: #008CBA;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #005f73;
    }
    @media (max-width: 600px) {
      nav {
        flex-direction: column;
      }
    }
  </style>

  </head>
<body>

  <header>
    <h1>Welcome to My First Webpage</h1>
  </header>

  <nav>
    <a href="home.html">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <div class="container">
    <h1>About This Page</h1>
    <p>This is a simple HTML webpage with basic features for beginners.</p>
    
    <img src="https://via.placeholder.com/600x200" alt="Sample Image">

    <form onsubmit="handleSubmit(event)">
      <h3>Contact Us</h3>
      <input  id="name" placeholder="Your Name" required />
      <input type="email" id="email" placeholder="Your Email" required />
      <button type="submit">Submit</button>
    </form>

    <br>
    <button onclick="sayHello()">Click Me</button>
  </div>

  <footer>
    <p>&copy; 2025 My Webpage. All rights reserved.</p>
  </footer>

  <script>
    function sayHello() {
      alert("Hello! Thanks for visiting.");
    }

    function handleSubmit(event) {
      event.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      alert(`Thank you, ${name}! We'll contact you at ${email}.`);
    }
  </script>
</body>
</html>
